<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5B9BFF">
<title>班主任工作台 · Class Workbench</title>
<!-- 本工作台为单文件HTML，数据存储在浏览器localStorage中，支持JSON导入导出 -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:#1f2937;background:#f5f7fa;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:#1f2937}
a{color:#5B9BFF;text-decoration:none}
ul{list-style:none}

/* ===== 布局 ===== */
.layout{display:flex;min-height:100vh}
/* 侧边栏 */
.sidebar{width:220px;background:#fff;border-right:1px solid #eef0f4;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;transition:transform .25s ease}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
.brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eef0f4;position:sticky;top:0;background:#fff;z-index:10}
.brand-logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#5B9BFF,#3B82F6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(91,155,255,.3)}
.brand-text h1{font-size:14px;font-weight:600;color:#111827;line-height:1.2}
.brand-text p{font-size:11px;color:#6b7280;margin-top:2px}

.nav{padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#4b5563;font-size:13.5px;cursor:pointer;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:#f3f6fb;color:#1f2937}
.nav-item.active{background:linear-gradient(95deg,#e8f1ff,#f5f9ff);color:#2563eb;font-weight:600}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;color:#6b7280}
.nav-item.active .ico{color:#2563eb}
.nav-item .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:600;min-width:18px;text-align:center}

/* 顶部栏 */
.main{flex:1;margin-left:220px;min-width:0}
.topbar{background:#fff;padding:14px 24px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.topbar h2{font-size:18px;font-weight:600;color:#111827}
.topbar .crumb{font-size:12px;color:#6b7280;margin-top:2px}
.topbar .actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.topbar-actions{display:flex;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;background:#f3f6fb;color:#374151;font-size:12.5px;border-radius:6px;transition:all .15s}
.tbtn:hover{background:#e8eef7}
.tbtn.primary{background:#5B9BFF;color:#fff}
.tbtn.primary:hover{background:#4a8aef}
.tbtn svg{width:13px;height:13px}
.user{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#f3f6fb;border-radius:20px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fb923c,#f97316);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;overflow:hidden;flex-shrink:0}
.user-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.user-role{font-size:11px;background:#10b981;color:#fff;padding:2px 6px;border-radius:4px;font-weight:500}
.user-name{font-size:13px;font-weight:500;color:#111827}

/* 内容区 */
.content{padding:20px 24px;max-width:1400px;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 卡片 */
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f1f3f7}
.card-header h3{font-size:15px;font-weight:600;color:#111827;display:flex;align-items:center;gap:8px}
.card-header h3 svg{width:18px;height:18px;color:#5B9BFF}
.card-header .actions{display:flex;gap:8px;align-items:center}

/* 统计卡片网格 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.stat-icon svg{width:24px;height:24px}
.stat-icon.b1{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.stat-icon.b2{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.stat-icon.b3{background:linear-gradient(135deg,#fb923c,#f97316)}
.stat-icon.b4{background:linear-gradient(135deg,#f472b6,#ec4899)}
.stat-icon.b5{background:linear-gradient(135deg,#34d399,#10b981)}
.stat-icon.b6{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.stat-info .v{font-size:24px;font-weight:700;color:#111827;line-height:1}
.stat-info .l{font-size:12px;color:#6b7280;margin-top:4px}
.stat-info .s{font-size:11px;color:#9ca3af;margin-top:4px}

/* 双栏布局 */
.row{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:1100px){.row{grid-template-columns:1fr}}

/* 待办 */
.todo-list .todo-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;margin-bottom:8px;background:#fafbfc;transition:all .15s}
.todo-item:hover{background:#f3f6fb}
.todo-item.overdue{background:#fff5f5;border-left:3px solid #ef4444}
.todo-item.done{opacity:.5;text-decoration:line-through}
.todo-check{width:18px;height:18px;border:2px solid #d1d5db;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.todo-check.checked{background:#10b981;border-color:#10b981;color:#fff}
.todo-content{flex:1;min-width:0}
.todo-content .title{font-size:13.5px;color:#1f2937;margin-bottom:2px}
.todo-content .meta{font-size:11px;color:#9ca3af}
.todo-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;flex-shrink:0}
.todo-tag.overdue{background:#fee2e2;color:#dc2626}
.todo-tag.today{background:#fef3c7;color:#d97706}
.todo-tag.tomorrow{background:#dbeafe;color:#2563eb}
.todo-tag.future{background:#f3f4f6;color:#4b5563}
.todo-tag.done{background:#d1fae5;color:#059669}
.todo-add{display:flex;gap:8px;margin-top:14px;padding:12px;background:#f9fafb;border-radius:8px}
.todo-add input,.todo-add .date-input{padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;outline:none}
.todo-add input[type=text]{flex:1}
.todo-add .add-btn{padding:8px 20px;background:#0d9488;color:#fff;border-radius:6px;font-weight:500;transition:all .15s}
.todo-add .add-btn:hover{background:#0f766e}
.todo-add .date-input{width:140px;font-size:13px}

/* 通知 */
.notice-item{padding:12px 0;border-bottom:1px solid #f3f4f6}
.notice-item:last-child{border-bottom:none}
.notice-item .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.notice-item .dot.blue{background:#3b82f6}
.notice-item .dot.red{background:#ef4444}
.notice-item .dot.orange{background:#f97316}
.notice-item .text{font-size:13px;color:#374151;line-height:1.5}
.notice-item .date{font-size:11px;color:#9ca3af;margin-top:4px;margin-left:18px}

/* 生日提醒 */
.birthday-list .bd-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6}
.birthday-list .bd-item:last-child{border-bottom:none}
.bd-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.bd-info{flex:1}
.bd-info .name{font-size:13px;color:#1f2937;font-weight:500}
.bd-info .date{font-size:11px;color:#9ca3af;margin-top:2px}
.bd-due{font-size:11px;padding:2px 6px;border-radius:3px;font-weight:500}
.bd-due.soon{background:#fef3c7;color:#d97706}
.bd-due.today{background:#fee2e2;color:#dc2626}

/* 考勤 */
.attendance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.att-item{background:#f9fafb;padding:14px;border-radius:8px;text-align:center}
.att-item .num{font-size:28px;font-weight:700;color:#1f2937;line-height:1}
.att-item .lbl{font-size:12px;color:#6b7280;margin-top:6px}
.att-item.present .num{color:#10b981}
.att-item.late .num{color:#f59e0b}
.att-item.absent .num{color:#ef4444}
.att-item.leave .num{color:#3b82f6}

/* 按钮 */
.btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s;border:1px solid transparent}
.btn svg{width:14px;height:14px}
.btn.primary{background:#5B9BFF;color:#fff}
.btn.primary:hover{background:#4a8aef}
.btn.danger{background:#ef4444;color:#fff}
.btn.danger:hover{background:#dc2626}
.btn.success{background:#10b981;color:#fff}
.btn.success:hover{background:#059669}
.btn.warn{background:#f59e0b;color:#fff}
.btn.ghost{background:#f3f6fb;color:#374151;border-color:#e5e7eb}
.btn.ghost:hover{background:#e8eef7}
.btn-sm{padding:4px 10px;font-size:12px}

/* 表格 */
.table-wrap{background:#fff;border-radius:8px;overflow-x:auto;border:1px solid #eef0f4}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;color:#374151;font-weight:600;text-align:left;padding:11px 12px;border-bottom:1px solid #eef0f4;font-size:12.5px}
td{padding:11px 12px;border-bottom:1px solid #f3f4f6;color:#1f2937;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag.boy{background:#dbeafe;color:#2563eb}
.tag.girl{background:#fce7f3;color:#be185d}
.tag.male{background:#dbeafe;color:#2563eb}
.tag.female{background:#fce7f3;color:#be185d}
.tag.green{background:#d1fae5;color:#059669}
.tag.red{background:#fee2e2;color:#dc2626}
.tag.orange{background:#fed7aa;color:#c2410c}
.tag.gray{background:#f3f4f6;color:#4b5563}
.tag.purple{background:#ede9fe;color:#7c3aed}
.tag.blue{background:#dbeafe;color:#2563eb}
.tag.pink{background:#fce7f3;color:#be185d}

/* 表单 */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:#374151;font-weight:500;margin-bottom:6px}
.form-group label .req{color:#ef4444}
.form-input{width:100%;padding:9px 12px;border:1px solid #e5e7eb;border-radius:6px;outline:none;transition:all .15s;background:#fff}
.form-input:focus{border-color:#5B9BFF;box-shadow:0 0 0 3px rgba(91,155,255,.1)}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}

/* 模态框 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex;animation:fadeIn .15s ease}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid #f1f3f7;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:600;color:#111827}
.modal-close{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#6b7280;cursor:pointer}
.modal-close:hover{background:#f3f4f6}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid #f1f3f7;display:flex;justify-content:flex-end;gap:8px}

/* 课程表 */
.schedule-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.schedule-grid{display:grid;grid-template-columns:72px repeat(5,1fr);gap:1px;background:#eef0f4;border-radius:8px;overflow:hidden;border:1px solid #eef0f4;font-size:12px}
.schedule-grid > div{padding:8px;background:#fff;text-align:center;min-height:60px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.schedule-grid .head{background:#f9fafb;font-weight:600;color:#374151;min-height:auto;padding:10px 6px}
.schedule-grid .time{background:#fafbfc;color:#6b7280;font-size:11px}
.schedule-grid .today-col{background:#fffbeb}
.schedule-grid .period-cell{position:relative;cursor:pointer;transition:all .15s}
.schedule-grid .period-cell:hover{filter:brightness(.95);transform:scale(1.02);z-index:2}
.subject-chip{display:block;font-weight:600;font-size:13px;padding:6px;border-radius:6px;color:#fff;width:100%}
.subject-name{display:block}
.subject-meta{font-size:10px;color:#6b7280;margin-top:2px}

/* 颜色 */
.subj-语文{background:#bbf7d0;color:#166534}
.subj-数学{background:#bfdbfe;color:#1e40af}
.subj-英语{background:#fed7aa;color:#9a3412}
.subj-物理{background:#ddd6fe;color:#5b21b6}
.subj-化学{background:#fecaca;color:#991b1b}
.subj-生物{background:#a7f3d0;color:#065f46}
.subj-政治{background:#fbcfe8;color:#9d174d}
.subj-历史{background:#e5e7eb;color:#374151}
.subj-地理{background:#fef3c7;color:#92400e}
.subj-音乐{background:#fde68a;color:#92400e}
.subj-美术{background:#fbcfe8;color:#9d174d}
.subj-体育{background:#bae6fd;color:#075985}
.subj-信息{background:#c7d2fe;color:#3730a3}
.subj-自习{background:#f3f4f6;color:#4b5563}
.subj-班会{background:#a5f3fc;color:#155e75}
.subj-阅读{background:#fed7aa;color:#9a3412}
.subj-实践{background:#bbf7d0;color:#166534}

/* 座次表 */
.seating-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#fafbfc;padding:14px;border-radius:8px}
.seat{aspect-ratio:1;border:2px solid #e5e7eb;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:11px;background:#fff;transition:all .15s;position:relative}
.seat:hover{border-color:#5B9BFF;transform:scale(1.05)}
.seat.empty{border-style:dashed;color:#9ca3af}
.seat .sno{font-size:10px;color:#9ca3af;position:absolute;top:4px;right:6px}
.seat .sname{font-weight:600;font-size:13px;color:#1f2937}
.seat .snum{font-size:10px;color:#9ca3af;margin-top:2px}
.blackboard{grid-column:1/-1;background:#1f2937;color:#fff;text-align:center;padding:6px;border-radius:4px;font-size:12px;margin-bottom:8px}

/* 图表 */
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.chart-card{background:#fff;border-radius:8px;padding:14px}
.chart-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding:8px 0 0;border-bottom:1px solid #f3f4f6}
.bar-item{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;height:100%}
.bar-fill{width:60%;background:linear-gradient(to top,#5B9BFF,#8bafff);border-radius:3px 3px 0 0;min-height:4px;transition:height .3s}
.bar-label{font-size:10px;color:#6b7280;margin-top:4px}
.bar-val{font-size:10px;color:#374151;font-weight:600}

.pie-wrap{display:flex;align-items:center;gap:14px}
.pie-svg{width:120px;height:120px;flex-shrink:0}
.pie-legend{flex:1}
.pie-leg-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px}
.pie-leg-color{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* 空状态 */
.empty{padding:40px 20px;text-align:center;color:#9ca3af}
.empty svg{width:50px;height:50px;color:#d1d5db;margin-bottom:10px}
.empty p{font-size:13px;margin-top:6px}

/* 移动端底部Tab */
.mobile-tabs{display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.1)}
  .main{margin-left:0}
  .topbar{padding:12px 16px}
  .topbar h2{font-size:16px}
  .topbar-actions .tbtn span{display:none}
  .content{padding:14px}
  .row{grid-template-columns:1fr}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eef0f4;z-index:90;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobile-tabs .mt-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;font-size:10px;color:#6b7280;border-radius:6px;cursor:pointer}
  .mobile-tabs .mt-item svg{width:18px;height:18px}
  .mobile-tabs .mt-item.active{color:#2563eb;background:#eff6ff}
  body{padding-bottom:60px}
  .menu-btn{display:inline-flex !important}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .attendance-grid{grid-template-columns:repeat(2,1fr)}
  .seating-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  .modal-mask{padding:10px;align-items:flex-end}
  .modal{max-width:100%;border-radius:12px 12px 0 0;max-height:92vh}
  .modal-head{padding:12px 14px}
  .modal-body{padding:14px}
  .content{padding:12px}
  .card{padding:14px}
  .card-header h3{font-size:15px}
  .toolbar .search{min-width:0;max-width:none;flex:1 1 100%}
  .table-wrap{overflow-x:auto}
  .table-wrap table{min-width:100%}
  table{font-size:12px}
  table th,table td{padding:8px 8px}
  .btn{padding:7px 11px;font-size:12px}
  .btn-sm{padding:5px 9px;font-size:12px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .bar-chart .bar-val{font-size:11px}
  .bar-chart .bar-label{font-size:11px}
  .chart-title{font-size:14px}
  .tag{font-size:11px}
  .list-row{padding:10px}
  .topbar-actions .tbtn{padding:6px}
  .tbtn{min-width:30px;min-height:30px}
  .seating-grid{gap:3px}
  .seating-grid .seat{min-height:40px;font-size:11px;padding:2px}
  .schedule-grid .cell{min-height:34px}
  .schedule-grid{min-width:520px}
  .dual-col{grid-template-columns:1fr}
  .pie-legend{font-size:11px}
  .actions{width:100%}
  .actions .btn{flex:1;justify-content:center}
}
@media(max-width:500px){
  .chart-row{grid-template-columns:1fr}
  .schedule-grid{font-size:11px}
  .schedule-grid .head{padding:8px 4px}
  .attendance-grid{grid-template-columns:1fr}
  .form-grid-3{grid-template-columns:1fr}
  .week-grid{grid-template-columns:repeat(2,1fr)}
  .stat-card .stat-info .v{font-size:22px}
}
.menu-btn{display:none;width:32px;height:32px;border-radius:6px;align-items:center;justify-content:center;background:#f3f6fb}
.menu-btn svg{width:18px;height:18px}

/* 工具栏 */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:200px;max-width:320px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;outline:none}
.toolbar .search:focus{border-color:#5B9BFF}
.toolbar select{padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;outline:none;font-size:13px}

/* 数据管理页 */
.dual-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){.dual-col{grid-template-columns:1fr}}

/* 工作留痕 tabs */
.pill-tabs{display:flex;gap:4px;border-bottom:1px solid #eef0f4;margin-bottom:14px;overflow-x:auto;white-space:nowrap}
.pill-tab{padding:8px 14px;cursor:pointer;color:#6b7280;font-size:13px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s}
.pill-tab.active{color:#2563eb;border-bottom-color:#2563eb}
.pill-tab:hover{color:#1f2937}

/* 进度环 */
.progress-ring{display:inline-block;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring text{font-weight:700;fill:#1f2937}

/* 头像组 */
.avatar-group{display:flex;align-items:center}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;border:2px solid #fff;margin-left:-6px}
.av:first-child{margin-left:0}
.av.male{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.av.female{background:linear-gradient(135deg,#f472b6,#ec4899)}

/* 抽屉 */
.drawer{position:fixed;top:0;right:-360px;width:340px;max-width:90vw;height:100vh;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.1);z-index:200;transition:right .25s ease;overflow-y:auto;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer-head{padding:16px 18px;border-bottom:1px solid #f1f3f7;display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{font-size:15px;font-weight:600}
.drawer-body{padding:18px;flex:1}
.drawer-foot{padding:14px 18px;border-top:1px solid #f1f3f7;display:flex;gap:8px}
.drawer-foot .btn{flex:1;justify-content:center}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:all .25s;font-size:13px;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#10b981}
.toast.error{background:#ef4444}
.toast.warn{background:#f59e0b}

/* 只读试用模式 */
.ro-banner{background:#fef3c7;border-bottom:1px solid #fde68a;color:#92400e;padding:9px 18px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ro-banner .ro-btn{background:#f59e0b;color:#fff;border:none;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer}
.ro-banner .ro-btn:hover{background:#d97706}
.ro-mode button,.ro-mode label.btn,.ro-mode .btn,.ro-mode .todo-check,.ro-mode .seat,.ro-mode .period-cell,.ro-mode .list-row{cursor:not-allowed!important;pointer-events:none!important;opacity:.55}
.ro-mode input,.ro-mode select,.ro-mode textarea{pointer-events:none;opacity:.6}
.ro-mode .notice-item,.ro-mode .stat-card,.ro-mode .bd-item{opacity:1}
.ro-free,.ro-free button,.ro-free label.btn,.ro-free input,.ro-free select,.ro-free textarea,.ro-free .btn{pointer-events:auto!important;opacity:1!important;cursor:pointer!important}
.ro-mode .ro-free button,.ro-mode .ro-free label.btn,.ro-mode .ro-free input,.ro-mode .ro-free select,.ro-mode .ro-free textarea,.ro-mode .ro-free .btn{pointer-events:auto!important;opacity:1!important;cursor:pointer!important}
.gr-del{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:none;background:#ef4444;color:#fff;font-size:13px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;padding:0}
.gr-del:hover{background:#dc2626}

/* 工作周记编辑器 */
.editor{border:1px solid #e5e7eb;border-radius:8px;background:#fff;overflow:hidden}
.editor-toolbar{padding:8px;background:#fafbfc;border-bottom:1px solid #f1f3f7;display:flex;gap:6px;flex-wrap:wrap}
.editor-toolbar button{padding:5px 9px;font-size:12px;border-radius:4px;background:#fff;color:#374151;border:1px solid transparent}
.editor-toolbar button:hover{background:#f3f4f6;border-color:#e5e7eb}
.editor-area{padding:12px;min-height:200px;outline:none;line-height:1.7}
.editor-area:focus{background:#fefefe}

/* 选项卡标签页 */
.tabset{display:flex;gap:8px;border-bottom:1px solid #eef0f4;margin-bottom:14px;flex-wrap:wrap}
.tabset button{padding:9px 14px;color:#6b7280;font-size:13px;font-weight:500;border-radius:6px 6px 0 0;transition:all .15s}
.tabset button.active{color:#2563eb;border-bottom:2px solid #2563eb;margin-bottom:-1px;background:#eff6ff}

/* 列表视图 */
.list-row{padding:12px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.list-row:hover{background:#fafbfc}
.list-row:last-child{border-bottom:none}
.list-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-ico svg{width:18px;height:18px;color:#fff}
.list-content{flex:1;min-width:0}
.list-content .t{font-size:13.5px;font-weight:500;color:#1f2937;margin-bottom:2px}
.list-content .m{font-size:11.5px;color:#9ca3af}

/* 颜色标签 */
.color-pick{display:flex;gap:6px;flex-wrap:wrap}
.color-pick span{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-pick span.active{border-color:#1f2937;transform:scale(1.1)}
</style>
</head>
<body>
<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">班</div>
      <div class="brand-text">
        <h1>班主任工作台</h1>
        <p>Class Workbench</p>
      </div>

    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h2 id="pageTitle">工作台</h2>
        <p class="crumb" id="pageCrumb">班级日常管理概览</p>
      </div>
      <div class="actions">
        <div class="user" onclick="openAvatarEditor()" style="cursor:pointer" title="点击更换头像">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              <span class="user-name" id="userName">admin</span>

            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="ro-banner" id="roBanner" style="display:none" onclick="go('license')">
      <span>试用模式 · 当前只能浏览，无法新增/编辑/导出数据</span>
      <span class="ro-btn">立即激活</span>
      <span style="font-size:11px;opacity:.8">输入激活码解锁全部功能</span>
    </div>

    <main class="content">
      <div id="pages"></div>
    </main>
  </div>
</div>

<!-- 移动端底部 -->
<nav class="mobile-tabs" id="mobileTabs"></nav>

<!-- 模态框 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <div class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M6 6l12 12M6 18L18 6"/></svg>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>
